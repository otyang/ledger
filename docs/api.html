<style>
  /* The page renders docs/openapi.yaml with Redoc, under a bar linking back to the site. */
  :root { --bar-bg: #14202a; --bar-fg: #e2e9ee; --bar-accent: #7cb0ea; --bar-h: 52px; }
  html, body { margin: 0; }
  body { background: #ffffff; }
  .bar {
    position: sticky; top: 0; z-index: 10;
    height: var(--bar-h); box-sizing: border-box;
    display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
    padding: 0 16px;
    background: var(--bar-bg); color: var(--bar-fg);
    font: 500 14px/1 "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  }
  .bar strong { font: 600 18px/1 "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; letter-spacing: 0.01em; }
  .bar a { color: var(--bar-fg); text-decoration: none; }
  .bar a:hover, .bar a:focus-visible { color: var(--bar-accent); }
  .bar .spacer { flex: 1; }
  .bar .spec { color: var(--bar-accent); }
  noscript p { font: 16px/1.5 "IBM Plex Sans", sans-serif; padding: 24px 16px; }
</style>
